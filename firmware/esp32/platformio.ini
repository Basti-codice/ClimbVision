; ClimbVision ESP32 – Beispiel-Firmware. NICHT auf echter Hardware getestet, NICHT kompiliert (M0–M6 liefen in einer Cloud-Umgebung ohne ESP32/Toolchain).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
  fastled/FastLED@^3.7.0
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.0
  h2zero/NimBLE-Arduino@^1.4.1
